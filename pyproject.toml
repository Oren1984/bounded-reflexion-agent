[project]
name = "bounded-reflexion-agent"
version = "0.1.0"
description = "Research-inspired POC: a bounded Reflexion-style coding agent with an immutable evaluation boundary."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",           # workflow / state machine
    "langchain-core>=1.6,<2",      # chat-model interface, messages, fake model for tests
    "langchain-anthropic>=1.7,<2", # the single model integration
    "langsmith>=0.14",             # optional tracing (trace URL lookup)
    "python-dotenv>=1.0",          # load .env
]

[project.optional-dependencies]
demo = ["streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bounded_reflexion"]

[tool.pytest.ini_options]
# tests/evaluation is the protected evaluator suite; it only runs inside the sandbox.
testpaths = ["tests/unit"]
markers = ["docker: needs a running Docker daemon and the bra-sandbox image"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long literal fixtures
